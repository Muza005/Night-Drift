<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Drift — макет A «Огни старта»</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&family=Manrope:wght@400..800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<style>
/* U1 mock A, «Огни старта»: the home screen is the start straight. A gantry runs across the
   top of the night city; the game's name is its banner; the two modes hang under it as lamp
   boxes. Pointing at a mode lights its five lamps one by one in the mode's colour, and on the
   last lamp its preview loop goes (here: a still frame from the game). Static mock: «Дрифт»
   is shown lit, «Трасса» at rest. */
:root {
  --mode: var(--c-cyan);
  --gantry: linear-gradient(180deg, var(--c-night-4), var(--c-night-2) 60%, var(--c-night-1));
  --lamp-off: radial-gradient(circle at 50% 40%, var(--c-night-3), var(--c-night-0) 70%);
  --cable: var(--line-strong);
  --gutter: clamp(16px, 4vw, 64px);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body { font: 400 var(--fs-md)/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
::selection { background: var(--c-rose); color: var(--c-night-1); }

/* the painted city from the engine, a little brighter than the menus show it today */
.scene { position: fixed; inset: 0; z-index: 0; background: url(u1/city-wide.webp) center 70% / cover no-repeat, var(--c-night-1); }
.scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5, 6, 16, 0.78) 0%, rgba(5, 6, 16, 0.25) 38%, rgba(5, 6, 16, 0.55) 78%, rgba(5, 6, 16, 0.92) 100%); }

.home { position: relative; z-index: 1; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }

/* ---------- the gantry ---------- */
.gantry {
  position: relative;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--sp-5);
  padding: calc(var(--sp-5) + env(safe-area-inset-top, 0px)) var(--gutter) var(--sp-5);
  background: var(--gantry);
  border-block-end: 1px solid var(--line-strong);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.banner { margin: 0; font-family: var(--f-display); font-weight: 900; font-stretch: 100%; line-height: 0.9; letter-spacing: -0.03em; font-size: clamp(34px, 6.2vw, 92px); white-space: nowrap; }
.banner .n { color: var(--text); }
.banner .d { color: var(--brand); }

.who { display: inline-flex; padding: 4px; border-radius: var(--r-pill); background: var(--surface-sunk); border: 1px solid var(--line); }
.who button { min-block-size: var(--btn-h); padding: 0 var(--sp-4); border: 0; border-radius: var(--r-pill); background: none; color: var(--text-quiet); font: 700 var(--fs-sm) var(--f-body); cursor: pointer; transition: color var(--dur-hover) var(--ease-out), background-color var(--dur-hover) var(--ease-out); }
.who button[aria-pressed="true"] { background: var(--c-ink-0); color: var(--c-night-1); }
.who button:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }

/* ---------- the two lamp boxes hanging under it ---------- */
.modes {
  display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: clamp(var(--sp-5), 4vw, var(--sp-8));
  padding: 0 var(--gutter) var(--sp-6);
}
.mode {
  --mode: var(--c-cyan);
  position: relative; display: grid; gap: var(--sp-3); align-content: start;
  padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: start; cursor: pointer;
}
.mode[data-mode="track"] { --mode: var(--c-rose); }
/* the lamp housing, bolted under the beam by two short rods */
.lamps {
  position: relative; justify-self: center; display: flex; gap: clamp(10px, 1.4vw, 18px);
  --drop: clamp(var(--sp-5), 7vh, 72px);
  padding: var(--sp-2) var(--sp-4); margin-block-start: var(--drop);
  border-radius: var(--r-pill); background: linear-gradient(180deg, var(--c-night-3), var(--c-night-1));
  box-shadow: 0 0 0 1px var(--line-strong), 0 10px 24px rgba(0, 0, 0, 0.55);
}
.lamps::before, .lamps::after {
  content: ""; position: absolute; inset-block: calc(-1 * var(--drop)) 100%; inline-size: 4px;
  background: linear-gradient(90deg, var(--c-night-4), var(--c-night-2)); box-shadow: 0 0 0 1px var(--line);
}
.lamps::before { inset-inline-start: 22%; } .lamps::after { inset-inline-end: 22%; }
.lamps i {
  inline-size: clamp(24px, 2.5vw, 36px); aspect-ratio: 1; border-radius: 50%;
  background: var(--lamp-off); box-shadow: inset 0 0 0 1px var(--line-strong), 0 2px 4px rgba(0, 0, 0, 0.6);
  transition: background-color var(--dur-hover) var(--ease-out), box-shadow var(--dur-hover) var(--ease-out);
}
.frame {
  position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden;
  border-radius: var(--r-md); background: var(--c-night-2) center / cover no-repeat;
  box-shadow: 0 0 0 1px var(--line), var(--shadow-lift);
  transition: box-shadow var(--dur-hover) var(--ease-out);
}
/* at rest the poster sits a little in the dark: a veil that only fades (opacity, not filter) */
.frame::before { content: ""; position: absolute; inset: 0; z-index: 1; background: rgba(5, 6, 16, 0.42); transition: opacity var(--dur-hover) var(--ease-out); }
.mode.is-live .frame::before, .mode:is(:hover, :focus-visible) .frame::before { opacity: 0; }
.mode[data-mode="track"] .frame { background-image: url(u1/drift-serpantin.webp); background-position: 50% 60%; }
.mode[data-mode="traffic"] .frame { background-image: url(u1/traffic-pass.webp); background-position: 50% 70%; }
/* the light on the poster at rest: a street lamp drifts over the body (CSS, no video) */
.frame::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 35%, rgba(255, 240, 210, 0.12) 50%, transparent 65%) -60% 0 / 220% 100% no-repeat;
  animation: lamp-pass 7s var(--ease-in-out) infinite;
}
@keyframes lamp-pass { to { background-position: 160% 0; } }
.name { font-family: var(--f-display); font-size: clamp(30px, 3.4vw, 52px); line-height: 1; letter-spacing: -0.02em; font-weight: 700; transition: font-weight var(--dur-hover) var(--ease-out); }
.line { color: var(--c-ink-1); max-inline-size: 44ch; font-size: var(--fs-md); }
.rec { font: 700 var(--fs-sm) var(--f-num); font-variant-numeric: tabular-nums; color: var(--record); }
.rec.call { font: 600 var(--fs-sm) var(--f-body); color: var(--text); }
.rec.call b { color: var(--mode); font-weight: 700; }

/* lit: the five lamps come on one after the other, the loop goes, the edge takes the colour */
.mode.is-live .lamps i,
.mode:is(:hover, :focus-visible) .lamps i { background: var(--mode); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5), 0 0 16px var(--mode), 0 0 2px var(--mode); }
.lamps i:nth-child(2) { transition-delay: 80ms; } .lamps i:nth-child(3) { transition-delay: 160ms; }
.lamps i:nth-child(4) { transition-delay: 240ms; } .lamps i:nth-child(5) { transition-delay: 320ms; }
.mode.is-live .frame,
.mode:is(:hover, :focus-visible) .frame { box-shadow: 0 0 0 2px var(--mode), 0 24px 60px -18px var(--mode); }
.mode.is-live .name,
.mode:is(:hover, :focus-visible) .name { font-weight: 900; }
.mode:focus-visible { outline: none; }
.mode:focus-visible .frame { outline: var(--focus-ring); outline-offset: 6px; }
.mode:active .frame { scale: 0.985; }
/* the playing loop's time, bottom right of the frame */
.tc { position: absolute; z-index: 2; inset-inline-end: var(--sp-3); inset-block-end: var(--sp-3); padding: 2px 8px; border-radius: var(--r-xs); background: rgba(5, 6, 16, 0.7); font: 500 var(--fs-xs) var(--f-num); color: var(--c-ink-1); opacity: 0; }
.mode.is-live .tc { opacity: 1; }

/* ---------- the quiet foot ---------- */
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-5); padding: 0 var(--gutter) calc(var(--sp-5) + env(safe-area-inset-bottom, 0px)); color: var(--text-quiet); font-size: var(--fs-sm); }
.foot button { min-block-size: var(--btn-h); padding: 0 var(--sp-4); border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); color: var(--c-ink-1); font: 600 var(--fs-sm) var(--f-body); cursor: pointer; backdrop-filter: var(--blur-panel); }
.foot button:focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-gap); }
.foot .soon { margin-inline-start: auto; }
.foot .soon b { color: var(--c-ink-1); font-weight: 700; }

@media (hover: hover) and (pointer: fine) { .foot button:hover, .who button:not([aria-pressed="true"]):hover { color: var(--text); } }

/* ---------- phones ---------- */
@media (max-width: 760px) {
  .gantry { grid-template-columns: 1fr; gap: var(--sp-3); padding-block: calc(var(--sp-3) + env(safe-area-inset-top, 0px)) var(--sp-4); }
  .banner { font-size: clamp(40px, 13.2vw, 64px); }
  .who { justify-self: stretch; } .who button { flex: 1; }
  .modes { grid-template-columns: 1fr; gap: var(--sp-4); padding-block-end: var(--sp-4); }
  .lamps { --drop: var(--sp-5); }
  .mode + .mode .lamps { margin-block-start: var(--sp-3); }
  .mode + .mode .lamps::before, .mode + .mode .lamps::after { display: none; }
  .name { font-size: 32px; }
  .line { font-size: var(--fs-sm); }
  .foot .soon { margin-inline-start: 0; }
}
/* sideways phones: the banner shrinks, the boxes sit side by side */
@media (max-height: 500px) and (orientation: landscape) {
  .gantry { padding-block: calc(var(--sp-2) + env(safe-area-inset-top, 0px)) var(--sp-2); }
  .banner { font-size: 26px; }
  .modes { grid-template-columns: 1fr 1fr; padding-block-end: var(--sp-3); }
  .frame { aspect-ratio: 2.6 / 1; }
  .name { font-size: 24px; }
  .mode { gap: var(--sp-2); }
  .foot { padding-block-end: calc(var(--sp-3) + env(safe-area-inset-bottom, 0px)); }
  .lamps { --drop: var(--sp-2); padding-block: 4px; }
  .lamps i { inline-size: 18px; }
  .modes { gap: var(--sp-4); }
  .mode + .mode .lamps { margin-block-start: var(--drop); }
  .mode + .mode .lamps::before, .mode + .mode .lamps::after { display: block; }
  .line { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .frame::after { animation: none; }
  .lamps i { transition-delay: 0s !important; }
  .name { transition: none; }
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"></div>
<main class="home">
  <header class="gantry">
    <h1 class="banner"><span class="n">Night</span> <span class="d">Drift</span></h1>
    <div class="who" role="group" aria-label="С кем ехать">
      <button type="button" aria-pressed="true">Один</button>
      <button type="button" aria-pressed="false">С друзьями</button>
    </div>
  </header>

  <div class="modes">
    <button type="button" class="mode is-live" data-mode="track" aria-labelledby="nTrack" aria-describedby="lTrack rTrack">
      <span class="lamps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="frame" role="img" aria-label="Занос на «Серпантине», кадр из игры"><span class="tc" aria-hidden="true">00:02.4</span></span>
      <span class="name" id="nTrack">Дрифт</span>
      <span class="line" id="lTrack">Держи занос в шпильках: угол и скорость дают очки, стена их сжигает. Шесть карт.</span>
      <span class="rec" id="rTrack">Серпантин 1:12.48</span>
    </button>
    <button type="button" class="mode" data-mode="traffic" aria-labelledby="nTraffic" aria-describedby="lTraffic rTraffic">
      <span class="lamps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="frame" role="img" aria-label="Проход между машинами на шоссе, кадр из игры"><span class="tc" aria-hidden="true">00:00.0</span></span>
      <span class="name" id="nTraffic">Трасса</span>
      <span class="line" id="lTraffic">Шоссе с потоком. Обгоняй впритык выше 80 км/ч и копи комбо до ×5.</span>
      <span class="rec call" id="rTraffic">Рекорда пока нет. <b>Поставь первый</b></span>
    </button>
  </div>

  <footer class="foot">
    <button type="button" aria-expanded="false">Управление</button>
    <span class="soon"><b>Карьера</b> скоро: сезон заездов и свой гараж</span>
  </footer>
</main>
</body>
</html>
