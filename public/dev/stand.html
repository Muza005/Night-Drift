<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Drift — стенд</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/screens.css">
<style>
  html, body { margin: 0; min-height: 100%; background: radial-gradient(120% 90% at 50% 10%, #1a1240 0%, #07080f 60%); color: var(--text); font: 15px/1.5 var(--f-body, system-ui); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  main { position: relative; display: grid; gap: var(--sp-4); padding: var(--sp-5) 16px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font: 800 var(--fs-xl)/1.1 var(--f-display, system-ui); }
  .bar { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; }
  select { min-height: 40px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-sunk); color: var(--text); font: inherit; }
  #big { height: min(62vh, 560px); }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); }
  .row .stand { height: 200px; border: 1px solid var(--line); border-radius: var(--r-lg); }
  #status { font: 600 13px var(--f-num, monospace); color: var(--text-quiet); }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr 1fr; } .row .stand:last-child { display: none; } #big { height: 52vh; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<main>
  <h1>Стенд</h1>
  <div class="bar">
    <label>Машина <select id="car"></select></label>
    <label>Цвет <select id="paint"></select></label>
    <span id="status">…</span>
  </div>
  <div id="big"></div>
  <div class="row"><div></div><div></div><div></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="../js/vendor/meshopt_decoder.js"></script>
<script type="module">
import { CARS, PAINTS, paintCode, DEFAULT_CAR, DEFAULT_PAINT } from '../js/core/cars.js';
import { createStand, startLoop } from '../js/ui/stand.js';

// One renderer for the page, as the game has one: every stand draws into its own box.
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
const phone = matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.25 : 1.5));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.setClearColor(0x000000, 0);
const size = () => renderer.setSize(innerWidth, innerHeight, false);
addEventListener('resize', size); size();

const q = new URLSearchParams(location.search);
const carSel = document.getElementById('car'), paintSel = document.getElementById('paint');
for (const c of CARS) carSel.add(new Option(c.name, c.id));
for (const p of PAINTS) paintSel.add(new Option(p.name, String(paintCode(p))));
carSel.value = q.get('car') || DEFAULT_CAR; paintSel.value = String(DEFAULT_PAINT);

const big = createStand({ renderer, el: document.getElementById('big') });
const small = [...document.querySelectorAll('.row > div')].map((el, i) => {
  const s = createStand({ renderer, el }); s.setCar(CARS[(i * 3 + 1) % CARS.length].id, paintCode(PAINTS[[4, 0, 9][i]])); return s;
});
const stands = [big, ...small];
const ready = big.setCar(carSel.value, Number(paintSel.value));
carSel.onchange = () => big.setCar(carSel.value, Number(paintSel.value));
paintSel.onchange = () => big.repaint(Number(paintSel.value));

// frames per second over the last second, and how many frames were drawn at all
const status = document.getElementById('status'), stat = { frames: 0, fps: 0, t: 0, n: 0 };
const loop = startLoop(now => {
  renderer.setScissorTest(false); renderer.clear();          // the stands only clear their own boxes
  for (const s of stands) s.frame(now);
  stat.frames++; stat.n++;
  if (now - stat.t >= 1000) { stat.fps = Math.round(stat.n * 1000 / (now - stat.t)); stat.n = 0; stat.t = now;
    const sp = big.spin; status.textContent = `${stat.fps} FPS · ${(sp.vel / (Math.PI * 2) * 60).toFixed(1)} об/мин${sp.held ? ' · держат' : ''}`; }
});
window.__stand = { big, stands, loop, stat, renderer };
ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
