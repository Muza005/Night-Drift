# Render Blueprint for the game + multiplayer server (Dashboard → New → Blueprint → this repo).
# Frankfurt is the closest Render region to Uzbekistan and the CIS (~80–120 ms ping).
services:
  - type: web
    name: night-drift-eu
    runtime: node
    region: frankfurt
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
